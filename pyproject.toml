[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoheat"
version = "0.1.0"
description = "Forensics for git repositories: churn, change hotspots and bus factor, straight from git log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edwin Martinez" }]
keywords = ["git", "churn", "hotspots", "bus-factor", "code-archaeology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repoheat = "repoheat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoheat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
